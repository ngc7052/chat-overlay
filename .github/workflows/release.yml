name: Release

# Publishes a release when app/payload/version.json names a version that has no
# tag yet. Merging anything else — a README fix, a bug fix without a version
# bump — runs this workflow, finds the tag already exists, and stops. So the way
# to ship is: bump version.json in the PR, merge, done.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Nothing is published unless typecheck, tests and coverage pass.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # tags decide whether this version is already out

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # Single source of truth for the runtime version lives in build.sh.
          ELECTRON=$(grep -oP 'ELECTRON_VERSION:-\K[0-9.]+' build.sh)
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"      >> "$GITHUB_OUTPUT"
          echo "electron=$ELECTRON" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released — bump package.json to publish a new one"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION has no tag yet — building a release"
          fi

      - uses: actions/setup-node@v7
        if: steps.v.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.v.outputs.publish == 'true'
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci

      - name: Cache Electron runtime
        if: steps.v.outputs.publish == 'true'
        uses: actions/cache@v6
        with:
          path: dist/electron-v*-win32-x64.zip
          key: electron-${{ steps.v.outputs.electron }}-win32-x64

      - name: Build
        if: steps.v.outputs.publish == 'true'
        run: ./build.sh --zip

      - name: Verify artifacts
        if: steps.v.outputs.publish == 'true'
        run: |
          set -euo pipefail
          test "$(cat dist/RELEASE_TAG)" = "${{ steps.v.outputs.tag }}"
          # A broken payload asset would break updating for every existing
          # install, so check it here rather than finding out after publishing.
          python3 - "${{ steps.v.outputs.version }}" <<'PY'
          import gzip, json, sys, zipfile
          version = sys.argv[1]

          manifest = json.load(gzip.open('dist/app-payload.json.gz'))
          assert manifest['version'] == version, (manifest['version'], version)
          for name in ('main.js', 'preload.js', 'version.json', 'renderer/index.html'):
              assert name in manifest['files'], f'payload missing {name}'
          declared = json.loads(manifest['files']['version.json']['data'])['version']
          assert declared == version, (declared, version)

          names = zipfile.ZipFile('dist/ChatOverlay.zip').namelist()
          for name in ('ChatOverlay.exe', 'resources/app/boot.js',
                       'resources/app/payload/main.js'):
              assert name in names, f'zip missing {name}'
          print(f'ok: v{version}, {len(manifest["files"])} payload files')
          PY

      - name: Publish
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer this version's CHANGELOG section; fall back to the blurb alone.
          node -e "
            const fs = require('node:fs');
            const version = process.argv[1];
            let body = '';
            try {
              const log = fs.readFileSync('CHANGELOG.md', 'utf8');
              const m = new RegExp('^## ' + version.replace(/\./g, '\\.') + '\\s*$([\\s\\S]*?)(?=^## |\\Z)', 'm').exec(log);
              if (m) body = m[1].trim();
            } catch {}
            fs.writeFileSync('changelog-section.md', body);
          " "${{ steps.v.outputs.version }}"
          cat > notes.md <<'EOF'
          Download **`ChatOverlay.zip`** below, unzip anywhere, run `ChatOverlay.exe`.
          Windows 10/11 64-bit — no installer, no Node.js, no admin rights.

          Windows shows a SmartScreen warning the first time because the exe is not
          code-signed: **More info → Run anyway**.

          Existing installs pick this up from Settings → **Updates** (about 35 KB).

          ---
          EOF
          if [ -s changelog-section.md ]; then
            printf '\n## Changes\n\n' >> notes.md
            cat changelog-section.md >> notes.md
          fi
          gh release create "${{ steps.v.outputs.tag }}" \
            dist/ChatOverlay.zip dist/app-payload.json.gz \
            --target "$GITHUB_SHA" \
            --title "ChatOverlay ${{ steps.v.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes
