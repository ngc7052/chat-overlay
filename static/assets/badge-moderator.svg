<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-label="moderator">
  <!--
    Moderator. The symbol Twitch draws for the same role — a sword pointing up
    and to the right on a green field — so a GoodGame or YouTube moderator reads
    as the same thing sitting next to a Twitch one. Every shape carries its own
    fill on purpose: this is drawn as an <img>, and a fill-less silhouette is
    what turned every GoodGame icon into the same blob once already.
  -->
  <rect width="18" height="18" rx="3.4" fill="#00ad03"/>
  <g transform="rotate(45 9 9)" fill="#ffffff">
    <path d="M6.8 2.6 9 0.6l2.2 2v7H6.8z"/>
    <path d="M3.6 9.8h10.8v1.9H3.6z"/>
    <path d="M8 11.7h2v3.5H8z"/>
    <path d="M6.8 15.1h4.4v1.7H6.8z"/>
  </g>
</svg>
