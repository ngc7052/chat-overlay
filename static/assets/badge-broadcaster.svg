<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-label="broadcaster">
  <!--
    Broadcaster. Twitch's own mark for the channel owner is a video camera on a
    red field; the same symbol here means a GoodGame HOST and a YouTube OWNER
